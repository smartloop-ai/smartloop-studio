<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .splash-container {
      background: #000000;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
    }

    .splash-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
    }

    .logo-text {
      color: white;
    }

    .logo-dot {
      color: #ec4899;
    }

    .status-text {
      color: #6b7280;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 0 0 8px 8px;
    }

    .progress-bar .slider {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #ec4899, transparent);
      border-radius: 2px;
      animation: slide 1.5s ease-in-out infinite;
    }

    @keyframes slide {
      0% {
        left: -40%;
      }

      100% {
        left: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="splash-container">
    <div class="splash-body">
      <div class="logo">
        <span class="logo-text">smartloop</span><span class="logo-dot">.</span>
      </div>
      <div class="status-text">Heating things up...</div>
    </div>
    <div class="progress-bar">
      <div class="slider"></div>
    </div>
  </div>
</body>

</html>
