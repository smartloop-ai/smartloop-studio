# Air quality for San Francisco.
#
# Drop this onto the "Add your own" card (or into ~/.smartloop/mcp.d/) to both
# install the connection and tell the crawler how to keep it indexed.
#
# Verified against the published package: `uvx air-quality-mcp` starts, and the
# server reports one tool — get_air_quality(city). If you point this at a
# different air-quality server, check its tool name and argument: `tools` is a
# list of candidates matched loosely, first match wins, and a step whose tool
# the server doesn't have is skipped rather than failing the crawl.

[[mcp]]
name = "air-quality"
package = "air-quality-mcp"

# A reading from this morning is not an answer to "how is the air right now".
# Without this the connection follows the app-wide schedule — every 10 minutes
# while idle, hourly regardless — which is slower than the source changes.
index_every = "30m"

# This is the shape of server that has nothing to enumerate: no `list_*` tool
# to walk, because it only answers questions you already know to ask. So the
# subjects come from here. Add cities to the list to index more of them; the
# label is what shows up as the document's source.
[[mcp.index]]
label = "air-quality-sf"
tools = ["get_air_quality"]
for_each = { city = ["San Francisco"] }
max_records = 10
max_parents = 5
