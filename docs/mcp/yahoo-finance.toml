# Yahoo Finance — company and market data.
#
# Drop this onto the "Add your own" card (or into ~/.smartloop/mcp.d/) to
# install the connection.
#
# Verified against the published package: the server reports get_stock_info,
# get_yahoo_finance_news, get_recommendations, get_stock_actions and
# get_financial_statement, each taking a ticker.
#
# Nothing here indexes anything. Those tools are enumerated once at
# registration and called when a question needs them, so a quote is as fresh as
# the question asking for it. This file used to carry a seven-ticker watchlist
# re-crawled every 15 minutes — 35 calls a quarter-hour spent keeping a
# snapshot that was stale by the time anyone read it, and useless for the
# eighth ticker. The watchlist is now whatever the question names.
#
# The package's dependency on the MCP SDK is unbounded and resolves to 2.x,
# which it doesn't support, so a bare `uvx yahoo-finance-mcp` dies on import.
# Discovery notices that failure and retries with `--with mcp<2` on its own, so
# `package = "yahoo-finance-mcp"` does eventually work — but it pays for a dead
# launch first. The explicit form below pins the SDK up front, and the retry
# stands down when `--with` is already there.

[[mcp]]
name = "yahoo-finance"
# The long form of what `package` would do, written out because this package
# needs the MCP SDK held at 1.x and a bare name has nowhere to say so. The same
# form takes any launcher that needs flags — plus `env` for a server that reads
# an API key out of the environment, and `cwd` for a checkout on disk. Set
# `command` or `package`, never both.
command = "uvx"
args = ["--with", "mcp<2", "yahoo-finance-mcp"]
# Extra substrings matched against an installed server's name, package and URL,
# so this file attaches to a connection someone already added as "yfinance".
match = ["yahoo", "yfinance"]
