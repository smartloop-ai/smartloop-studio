# Yahoo Finance — company and market data for a watchlist.
#
# Drop this onto the "Add your own" card (or into ~/.smartloop/mcp.d/) to both
# install the connection and tell the crawler what to keep indexed.
#
# Verified against the published package: every tool name and argument below was
# read back from the running server, and every step was called once for AAPL.
#
# The package's dependency on the MCP SDK is unbounded and resolves to 2.x,
# which it doesn't support, so a bare `uvx yahoo-finance-mcp` dies on import.
# Nothing to do about that here — discovery notices the failure and retries with
# `--with mcp<2` automatically.

[alias]
# One list, reused by every step. Add tickers here rather than to each step, so
# a watchlist change is a single edit.
watchlist = ["AAPL"]

[[mcp]]
name = "yahoo-finance"
package = "yahoo-finance-mcp"
match = ["yahoo", "yfinance"]

# Quotes move all day; the profile and financials underneath them do not. This
# is the cadence the quote needs — the slower fields simply get re-fetched
# along with it, which costs one call each.
index_every = "15m"

# This is the shape of server that has nothing to enumerate: no `list_*` tool to
# walk, because it only answers questions you already know to ask. So the
# subjects come from this file — `for_each` runs each step once per ticker.

# The richest single call: company profile (name, sector, industry, employees,
# HQ, business summary) together with the live quote, market cap, P/E and the
# 52-week range. If you keep only one step, keep this one.
[[mcp.index]]
label = "stock-info"
tools = ["get_stock_info"]
for_each = { ticker = ["@watchlist"] }
max_records = 10
max_parents = 25

[[mcp.index]]
label = "news"
tools = ["get_yahoo_finance_news"]
for_each = { ticker = ["@watchlist"] }
max_records = 60
max_parents = 25

# Analyst spread — strong buy / buy / hold / sell counts by month.
# `recommendation_type` also takes "upgrades_downgrades" for the rating-change
# history instead.
[[mcp.index]]
label = "recommendations"
tools = ["get_recommendations"]
for_each = { ticker = ["@watchlist"] }
arguments = { recommendation_type = "recommendations" }
max_records = 20
max_parents = 25

# Dividends and splits.
[[mcp.index]]
label = "actions"
tools = ["get_stock_actions"]
for_each = { ticker = ["@watchlist"] }
max_records = 40
max_parents = 25

# Annual income statement. `financial_type` also takes "balance_sheet",
# "cashflow", and the "quarterly_" variants of all three.
[[mcp.index]]
label = "financials"
tools = ["get_financial_statement"]
for_each = { ticker = ["@watchlist"] }
arguments = { financial_type = "income_stmt" }
max_records = 20
max_parents = 25
