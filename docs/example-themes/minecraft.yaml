# Example theme — not shipped as a built-in. Drop this file onto the Theme
# section in Settings to import it. It doubles as a reference for authoring your
# own theme: a full color palette plus custom rail icons embedded as inline SVG
# (use stroke/fill="currentColor" so they inherit the sidebar's active states).
id: minecraft
name: Minecraft
description: Grassy blocky world, inspired by Minecraft
mode: dark
colors:
  bg:     { base: '#101a0c', surface1: '#1b2a12', surface2: '#26381a', surface3: '#375226', input: '#1b2a12', elevated: '#131f0d' }
  brand:  { primary: '#5db02c', hover: '#4e9625', active: '#3f7a1e', light: '#7bc94a' }
  text:   { primary: '#eaf3df', secondary: '#cfe0bf', tertiary: '#adc196', muted: '#7f9668', disabled: '#5a6f47', faint: '#425234' }
  status: { error: '#d64b3f', success: '#5db02c', online: '#5db02c', warning: '#f0b429', info: '#4fc3d6', purple: '#a06cd5' }
  border: { subtle: '#1b2a12', default: '#2e4420', hover: '#375226', code: '#2e4420' }
  table:  { head: '#1b2a12', hover: '#26381a', stripe: '#131f0d', inlineCode: '#1b2a12' }
# Pixel typeface — body uses VT323, headings the chunkier Press Start 2P.
font:
  family: "'VT323', 'Press Start 2P', ui-monospace, monospace"
  heading: "'Press Start 2P', 'VT323', monospace"
  url: 'https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap'
# Blocky, pixel-art rail icons.
icons:
  models:    '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="10" height="3" fill="currentColor"/><rect x="3" y="6" width="10" height="7" fill="currentColor" opacity="0.5"/></svg>'
  documents: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="4" y="2" width="8" height="12" fill="currentColor" opacity="0.5"/><rect x="5" y="4" width="6" height="1" fill="currentColor"/><rect x="5" y="6" width="6" height="1" fill="currentColor"/><rect x="5" y="8" width="6" height="1" fill="currentColor"/><rect x="5" y="10" width="4" height="1" fill="currentColor"/></svg>'
  mcp:       '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="2" y="6" width="4" height="4" fill="currentColor"/><rect x="10" y="6" width="4" height="4" fill="currentColor"/><rect x="6" y="7" width="4" height="2" fill="currentColor" opacity="0.6"/></svg>'
  skills:    '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="9" y="2" width="4" height="2" fill="currentColor"/><rect x="8" y="4" width="2" height="2" fill="currentColor"/><rect x="6" y="6" width="2" height="2" fill="currentColor"/><rect x="4" y="8" width="3" height="3" fill="currentColor" opacity="0.6"/><rect x="2" y="11" width="2" height="2" fill="currentColor"/></svg>'
  settings:  '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="6" y="2" width="4" height="12" fill="currentColor" opacity="0.5"/><rect x="2" y="6" width="12" height="4" fill="currentColor" opacity="0.5"/><rect x="6" y="6" width="4" height="4" fill="currentColor"/></svg>'
