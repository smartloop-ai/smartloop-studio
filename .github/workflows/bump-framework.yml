name: Bump Framework Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New framework version (e.g. 1.0.7)'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format '${{ inputs.version }}'. Expected semver (e.g. 1.0.7)"
            exit 1
          fi

      - name: Bump VERSION in slp-setup.js
        run: |
          sed -i "s/^const VERSION = '.*';$/const VERSION = '${{ inputs.version }}';/" electron/slp-setup.js
          grep "const VERSION" electron/slp-setup.js

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bump-framework-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add electron/slp-setup.js
          git commit -m "bump framework version to ${{ inputs.version }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Bump framework version to ${{ inputs.version }}" \
            --body "Bumps \`VERSION\` in \`electron/slp-setup.js\` to \`${{ inputs.version }}\`." \
            --base main
