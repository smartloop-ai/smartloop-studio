name: Build and Deploy Electron App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.18). Blank = the version in package.json, i.e. redo the current one (also tick overwrite).'
        required: false
        type: string
      overwrite:
        description: 'Overwrite an existing bucket version dir instead of failing.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish the release (PATCH to published) instead of leaving it a draft. Leave off for ad-hoc/test builds.'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Release version passed by the calling workflow. Blank = the version in package.json.'
        required: false
        type: string
      overwrite:
        description: 'Overwrite an existing bucket version dir instead of failing.'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish the release instead of leaving it a draft. release-prod passes true so a merge to main goes live.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  # Azure OIDC (federated) login for Trusted Signing on the Windows build.
  id-token: write

env:
  # Releases live in Cloudflare R2 (no egress charge) and are served at
  # dl.smartloop.ai; see slp-infra-project cloudflare/README.md.
  R2_BUCKET: smartloop-releases
  # Versions can be re-uploaded (overwrite=true on a draft), so cache briefly.
  R2_CACHE_CONTROL: public, max-age=3600
  APP_NAME: smartloop-studio
  # Matches ci_push_release.py's default base URL.
  RELEASES_API_BASE_URL: https://api.smartloop.ai

jobs:
  notify-start:
    runs-on: ubuntu-latest
    outputs:
      framework_version: ${{ steps.fw.outputs.version }}
      build_version: ${{ steps.bv.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get framework version
        id: fw
        run: |
          VERSION=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" electron/slp-setup.js)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get build version
        id: bv
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Artifacts are named from package.json, so publishing under any other
      # version would ship a release that claims X and installs Y — clients would
      # update, still report Y, and re-download on every check. Fails here rather
      # than after a 12-minute build.
      - name: Validate release version
        if: ${{ inputs.version != '' }}
        run: |
          IN="${{ inputs.version }}"
          PKG="${{ steps.bv.outputs.version }}"
          if [ "$IN" != "$PKG" ]; then
            echo "::error::version '$IN' does not match package.json '$PKG'. Artifacts are built and named from package.json, so publishing under '$IN' would ship a release that installs '$PKG'. Dispatch from a ref whose package.json is '$IN', or leave version blank to use '$PKG'."
            exit 1
          fi
          echo "version '$IN' matches package.json."

      - name: Notify build started
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Build started*\n*Ref:* `${{ github.ref_name }}`\n*Repo:* `${{ github.repository }}`\n*Framework:* `${{ steps.fw.outputs.version }}`\n*Triggered by:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

  build-macos:
    needs: [notify-start]
    name: Build for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Import Apple Code Signing Certificates
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

      # SLP is bundled inside the macOS .app, so it must be
      # staged at build/slp/ before packaging or electron-builder fails.
      - name: Stage SLP framework
        uses: ./.github/actions/stage-slp

      # Models and the project template, and a hard check that every
      # extraResources source exists. electron-builder only WARNS on a missing
      # source ("file source doesn't exist") and packages without it, which is
      # how the Windows installer shipped with no models at all.
      - name: Stage bundled resources
        uses: ./.github/actions/stage-resources
        with:
          api-base-url: ${{ secrets.VITE_BASE_URL }}

      - name: Build for macOS
        run: make build-electron-mac
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CSC_LINK/CSC_KEY_PASSWORD on purpose. With them set,
          # electron-builder imports the .p12 into a temp keychain of its own and
          # then runs `security set-key-partition-list -k <p12 password>` --- it
          # passes the certificate password where the *keychain* password belongs
          # (app-builder-lib/out/codeSign/macCodeSign.js, importCerts). The
          # runner image now treats that mismatch as fatal:
          # "SecKeychainUnlock: The user name or passphrase you entered is not
          # correct". Left unset, electron-builder signs from the keychain search
          # list --- the signing_temp keychain the import step above already set
          # up --- which is exactly how the Mac App Store job below signs.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml
          retention-days: 1

  build-linux:
    needs: [notify-start]
    name: Build for Linux (${{ matrix.arch }})
    # Native runners per arch: the SLP framework and better-sqlite3 are built
    # for the host, so arm64 is packaged on an arm64 runner, not cross-built.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Free ~20 GB of preinstalled tooling so the bundled SLP framework + the
      # AppImage and deb (each embedding it) don't exhaust the runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: Stage SLP framework
        uses: ./.github/actions/stage-slp

      # Models and the project template, and a hard check that every
      # extraResources source exists. electron-builder only WARNS on a missing
      # source ("file source doesn't exist") and packages without it, which is
      # how the Windows installer shipped with no models at all.
      - name: Stage bundled resources
        uses: ./.github/actions/stage-resources
        with:
          api-base-url: ${{ secrets.VITE_BASE_URL }}

      - name: Build for Linux
        run: make build-electron-linux
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder names the arm64 feed latest-linux-arm64.yml.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-linux*.yml
          retention-days: 1

  build-windows:
    needs: [notify-start]
    name: Build for Windows
    runs-on: windows-latest
    # Scopes the Azure OIDC token to a stable subject
    # (repo:smartloop-ai/smartloop-studio:environment:release) so a single
    # Trusted Signing federated credential covers both tag-push and manual
    # dispatch runs — same pattern as smartloop-ai/smartloop's build.yml.
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Authenticode-sign the app and installer with the same Azure Trusted
      # Signing account/profile that signs slp.exe in smartloop-ai/smartloop.
      # Auth is OIDC (federated) via the job's `id-token: write` — no secrets.
      # scripts/win-sign.js (electron-builder sign hook) does the signing.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The GitHub OIDC token azure/login exchanges is a client assertion that
      # is only valid for ~5 minutes. Signing runs ~11 minutes later (npm
      # install + build sit between login and the sign hook), so by the time
      # the Trusted Signing dlib asks the Azure CLI for a code-signing token,
      # az must re-present the now-expired assertion and fails with
      # AADSTS700024 ("Client assertion is not within its valid time range").
      # Fetch the code-signing token here, while the assertion is still fresh,
      # so az caches it (~75 min lifetime) — the dlib's AzureCliCredential then
      # gets a cache hit at sign time and never touches the expired assertion.
      # See https://github.com/Azure/login/issues/180.
      - name: Pre-fetch Trusted Signing token (before the OIDC assertion expires)
        shell: pwsh
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none

      # The sign hook shells out to Invoke-TrustedSigning via powershell.exe.
      # Install machine-wide (AllUsers → Program Files\WindowsPowerShell\
      # Modules): the runner presets the PSModulePath env var with PowerShell 7
      # paths only, so a CurrentUser install (Documents\WindowsPowerShell\
      # Modules) is invisible to the powershell.exe the hook spawns.
      # The version is pinned because the dependency prewarm step below must
      # match the exact package versions this module release expects.
      - name: Install TrustedSigning PowerShell module
        shell: powershell
        run: |
          try { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction Stop } catch {}
          Install-Module -Name TrustedSigning -RequiredVersion 0.5.8 -Force -Repository PSGallery -Scope AllUsers

      # Invoke-TrustedSigning bootstraps its NuGet dependencies (signtool from
      # the SDK BuildTools + the Trusted Signing dlib) on first use through
      # PackageManagement, which fails in the bare powershell.exe session the
      # sign hook spawns (empty package source on the hosted runner). Download
      # the exact pinned versions into the layout the module probes
      # (%LOCALAPPDATA%\TrustedSigning\<name>\<name>.<version>\) so it treats
      # them as installed and skips that bootstrap. A .nupkg is a plain zip.
      # The optional "sign" CLI package is not prewarmed — exe files go
      # through the SignTool path and its bootstrap failure is non-fatal.
      - name: Prewarm Trusted Signing dependencies
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:LOCALAPPDATA 'TrustedSigning'
          $packages = @(
            @{ Name = 'Microsoft.Windows.SDK.BuildTools'; Version = '10.0.26100.4188'; Probe = 'bin\10.0.26100.0\x64\signtool.exe' },
            @{ Name = 'Microsoft.Trusted.Signing.Client'; Version = '1.0.95'; Probe = 'bin\x64\Azure.CodeSigning.Dlib.dll' }
          )
          foreach ($p in $packages) {
            $dir = Join-Path (Join-Path $root $p.Name) "$($p.Name).$($p.Version)"
            if (-not (Test-Path (Join-Path $dir $p.Probe))) {
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              $zip = Join-Path $env:TEMP "$($p.Name).zip"
              Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$($p.Name)/$($p.Version)" -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              Remove-Item $zip -Force
            }
            if (-not (Test-Path (Join-Path $dir $p.Probe))) { throw "$($p.Name) prewarm failed: $($p.Probe) not found" }
            Write-Host "$($p.Name) $($p.Version) ready"
          }

      - name: Stage SLP framework
        uses: ./.github/actions/stage-slp

      # Models and the project template, and a hard check that every
      # extraResources source exists. electron-builder only WARNS on a missing
      # source ("file source doesn't exist") and packages without it, which is
      # how the Windows installer shipped with no models at all.
      - name: Stage bundled resources
        uses: ./.github/actions/stage-resources
        with:
          api-base-url: ${{ secrets.VITE_BASE_URL }}

      - name: Build for Windows
        run: npm run electron-build-win
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}

      - name: Verify signature
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No setup exe found in dist/' }
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "$($setup.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "$($setup.Name) signature is $($sig.Status), expected Valid"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 1

  upload-to-gcp:
    name: Upload to R2
    needs: [notify-start, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    outputs:
      download_urls: ${{ steps.urls.outputs.download_urls }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-build-*
          merge-multiple: true
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      # The aws CLI on the runner talks to R2's S3 API. Single-part PUTs
      # (every installer is under the 5 GB limit) keep each object's ETag its
      # MD5, which clients verify downloads against.
      - name: Configure R2 access
        run: |
          for s in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is not set"; exit 1; }
          done
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo "AWS_ENDPOINT_URL=$R2_ENDPOINT"
            echo "AWS_DEFAULT_REGION=auto"
            echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"
            echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
          } >> "$GITHUB_ENV"
          aws configure set default.s3.multipart_threshold 5GB
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # Every release path is version-based. A blank input means "redo the
      # version package.json already declares" — validated equal to package.json
      # in notify-start, so both paths resolve to the same string the artifacts
      # are named after. Redoing a version that is already in the bucket is what
      # the overwrite guard below is for.
      - name: Get version info
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${{ needs.notify-start.outputs.build_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Two protections, so `overwrite` can only ever repair a draft:
      #   1. an existing bucket dir needs `overwrite` to be replaced;
      #   2. a published/revoked version is refused outright, because swapping
      #      its bytes leaves the feed's sha512 describing files that no longer
      #      exist — every client already on that feed fails the integrity check.
      # The API is only consulted once the dir is known to exist, so API trouble
      # can never block a fresh release.
      - name: Guard against overwriting an existing release
        env:
          SLP_ADMIN_TOKEN_PROD: ${{ secrets.SLP_ADMIN_TOKEN_PROD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OVERWRITE="${{ inputs.overwrite }}"

          # list-objects-v2 fails only on real errors (auth, typo'd bucket) and
          # reports an empty prefix as KeyCount 0, so the two can't be confused.
          # Every failure is unknowable, and the whole check branches on this.
          set +e
          LS_OUT=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "$VERSION/" \
            --max-keys 1 --query KeyCount --output text 2>&1); LS_RC=$?
          set -e
          if [ $LS_RC -ne 0 ]; then
            echo "::error::Could not check $R2_BUCKET/$VERSION/ — refusing to upload blind. $LS_OUT"
            exit 1
          fi
          if [ "$LS_OUT" = 0 ]; then
            echo "No existing $VERSION dir in bucket — safe to upload."
            exit 0
          fi

          CODE=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $SLP_ADMIN_TOKEN_PROD" \
            "$RELEASES_API_BASE_URL/v1/releases/$VERSION" || echo 000)
          case "$CODE" in
            404) STATUS=none ;;
            200) STATUS=$(jq -r '.status // "unknown"' /tmp/release.json 2>/dev/null || echo unknown) ;;
            *)   echo "::error::Could not read release $VERSION from the API (HTTP $CODE) — cannot confirm it is safe to overwrite."; exit 1 ;;
          esac

          if [ "$STATUS" = published ] || [ "$STATUS" = revoked ] || [ "$STATUS" = unknown ]; then
            echo "::error::Release $VERSION is $STATUS. Replacing its artifacts would leave the release feed advertising a sha512 for bytes that no longer exist, breaking updates for every client already on it. Bump the version instead."
            exit 1
          fi

          if [ "$OVERWRITE" = true ]; then
            echo "$VERSION exists (status: $STATUS) and overwrite was requested — proceeding."
            exit 0
          fi
          echo "::error::Release $VERSION already exists at $R2_BUCKET/$VERSION/ (status: $STATUS) — refusing to overwrite. Bump the version, or re-run with overwrite=true to replace the draft."
          exit 1

      - name: Create version directory structure
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/$VERSION/macos
          mkdir -p release/$VERSION/linux
          mkdir -p release/$VERSION/windows

          if [ -d "artifacts/macos" ]; then
            mv artifacts/macos/*.dmg artifacts/macos/*.blockmap release/$VERSION/macos/ 2>/dev/null || true
          fi

          if [ -d "artifacts/linux" ]; then
            mv artifacts/linux/*.AppImage artifacts/linux/*.deb artifacts/linux/*.blockmap release/$VERSION/linux/ 2>/dev/null || true
          fi

          if [ -d "artifacts/windows" ]; then
            mv artifacts/windows/*.exe artifacts/windows/*.blockmap release/$VERSION/windows/ 2>/dev/null || true
          fi

          # No local copy for latest/. Every platform bundles the SLP framework
          # now, so release/$VERSION is ~8 GB; duplicating it filled the runner
          # disk hard enough that the runner could not write its own logs
          # ("No space left on device"). The upload step below pushes this one
          # directory to both bucket prefixes instead.

      # Versions can be re-uploaded (overwrite=true on a draft), so objects are
      # cached for an hour rather than forever.
      - name: Upload to R2
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The same files under $VERSION/ and latest/, both sourced from
          # release/$VERSION. No local copy for latest/: every platform bundles
          # the SLP framework, so release/$VERSION is ~8 GB and duplicating it
          # fills the runner disk.
          for prefix in "$VERSION" latest; do
            aws s3 cp "release/$VERSION/" "s3://$R2_BUCKET/$prefix/" --recursive \
              --cache-control "public, max-age=3600" --no-progress
          done

      - name: Collect public download URLs
        id: urls
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://dl.smartloop.ai"
          URLS=""
          if [ -d "release/$VERSION/macos" ]; then
            URLS="*MacOS:*\n"
            for f in release/$VERSION/macos/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/macos/${fname}|${fname}>\n"
            done
          fi
          if [ -d "release/$VERSION/linux" ]; then
            URLS="${URLS}*Linux:*\n"
            for f in release/$VERSION/linux/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/linux/${fname}|${fname}>\n"
            done
          fi
          if [ -d "release/$VERSION/windows" ]; then
            URLS="${URLS}*Windows:*\n"
            for f in release/$VERSION/windows/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/windows/${fname}|${fname}>\n"
            done
          fi
          # Write as single line with literal \n so it's safe inside JSON strings
          echo "download_urls=${URLS}" >> $GITHUB_OUTPUT

      - name: Create version manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > manifest.json << EOF
          {
            "version": "$VERSION",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "files": {
              "macos": [
                $(cd release/$VERSION/macos 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ],
              "linux": [
                $(cd release/$VERSION/linux 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ],
              "windows": [
                $(cd release/$VERSION/windows 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ]
            }
          }
          EOF

      # After the installers, so latest/manifest.json never names a file that
      # isn't uploaded yet.
      - name: Upload manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          aws s3 cp manifest.json "s3://$R2_BUCKET/$VERSION/manifest.json" \
            --content-type application/json --cache-control "public, max-age=3600"
          aws s3 cp manifest.json "s3://$R2_BUCKET/latest/manifest.json" \
            --content-type application/json --cache-control "public, max-age=300"

      - name: Generate download URLs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Download URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**macOS:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          aws s3 ls "s3://$R2_BUCKET/$VERSION/macos/" >> $GITHUB_STEP_SUMMARY || echo "No macOS builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Linux:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          aws s3 ls "s3://$R2_BUCKET/$VERSION/linux/" >> $GITHUB_STEP_SUMMARY || echo "No Linux builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Windows:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          aws s3 ls "s3://$R2_BUCKET/$VERSION/windows/" >> $GITHUB_STEP_SUMMARY || echo "No Windows builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  create-draft-release:
    name: Create Draft Release
    needs: [upload-to-gcp]
    if: needs.upload-to-gcp.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS yml
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos
          pattern: latest-mac.yml

      # `pattern` matches artifact names, not files inside them, so pull both
      # Linux builds and pick the feed ymls out below.
      - name: Download Linux yml
        uses: actions/download-artifact@v4
        with:
          pattern: linux-build-*
          merge-multiple: true
          path: artifacts/linux

      - name: Download Windows yml
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows
          pattern: latest.yml

      - name: Build release JSON
        run: |
          python scripts/build-release-json.py \
            --cdn-base-url https://dl.smartloop.ai \
            --version "${{ needs.upload-to-gcp.outputs.version }}" \
            --output release.json \
            artifacts/macos/latest-mac.yml \
            artifacts/linux/latest-linux.yml \
            artifacts/linux/latest-linux-arm64.yml \
            artifacts/windows/latest.yml
          echo "--- Release payload ---"
          cat release.json

      - name: Create draft release via API
        env:
          SLP_ADMIN_TOKEN_PROD: ${{ secrets.SLP_ADMIN_TOKEN_PROD }}
        run: |
          python scripts/ci_push_release.py \
            --file release.json \
            --draft-only

      # Hand the exact payload to the gated publish job so it PATCHes the same
      # artifacts to published — no re-deriving it from yml a second time.
      - name: Upload release.json for publish step
        uses: actions/upload-artifact@v4
        with:
          name: release-json
          path: release.json

  # ── Gated go-live: create-draft-release always drafts; this promotes the
  # draft to `published`. It runs in the dedicated `production` environment
  # (kept separate from `release`, which the Windows build uses for OIDC, so a
  # required reviewer here gates only the publish, not the build). With a
  # required reviewer configured it pauses for a manual approval in the Actions
  # UI before publishing. Only runs when the caller opts in via `publish: true`
  # (release-prod does; ad-hoc dispatch does not).
  publish-release:
    name: Publish Release
    needs: [create-draft-release]
    if: ${{ inputs.publish && needs.create-draft-release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release.json
        uses: actions/download-artifact@v4
        with:
          name: release-json
          path: .

      # Re-runs ci_push_release.py without --draft-only: it re-upserts the draft
      # (idempotent) and PATCHes it to published, after the server's per-artifact
      # HEAD validation against the dl.smartloop.ai files uploaded in upload-to-gcp.
      - name: Publish release via API
        env:
          SLP_ADMIN_TOKEN_PROD: ${{ secrets.SLP_ADMIN_TOKEN_PROD }}
        run: |
          python scripts/ci_push_release.py --file release.json

  notify-result:
    if: always()
    needs: [notify-start, build-macos, build-linux, build-windows, upload-to-gcp, create-draft-release]
    runs-on: ubuntu-latest
    steps:
      # Artifact links live in the run summary, not Slack: a version-less
      # dispatch publishes nothing, and whoever dispatched it is already looking
      # at the run. Runs here rather than in upload-to-gcp so the links still get
      # written on runs where that job is gated out.
      - name: Print GitHub artifact download URLs
        # Informational only. Both Slack steps below carry an `if:` without a
        # status function, so GitHub ANDs an implicit success() into them — a
        # failure here would otherwise silence the failure alert itself.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
              per_page: 100
            });
            core.info(`GitHub Actions run: ${runUrl}`);
            if (!data.artifacts || data.artifacts.length === 0) {
              core.info("No artifacts found for this run.");
              await core.summary
                .addHeading("GitHub Artifact Downloads", 2)
                .addRaw(`Run: ${runUrl}\n\nNo artifacts found for this run.\n`)
                .write();
              return;
            }
            const links = data.artifacts.map((artifact) =>
              `- ${artifact.name}: https://github.com/${owner}/${repo}/actions/runs/${run_id}/artifacts/${artifact.id}`
            );
            core.info("GitHub artifact download URLs:");
            for (const link of links) {
              core.info(link);
            }
            await core.summary
              .addHeading("GitHub Artifact Downloads", 2)
              .addRaw(`Run: ${runUrl}\n\n`)
              .addRaw(links.join("\n") + "\n")
              .write();

      # Success means the release actually exists: artifacts on the CDN *and* a
      # draft in the releases API. Gating on upload alone reported green when the
      # draft POST failed.
      - name: Notify build success
        if: ${{ needs.upload-to-gcp.result == 'success' && needs.create-draft-release.result == 'success' }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Build succeeded*\n*Build:* `${{ needs.notify-start.outputs.build_version }}`\n*Release:* `${{ needs.upload-to-gcp.outputs.version }}`\n*Framework:* `${{ needs.notify-start.outputs.framework_version }}`\n\n*Downloads:*\n${{ needs.upload-to-gcp.outputs.download_urls }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

      # Any failed/cancelled job, whatever the trigger — a broken main build is
      # worth knowing about even on a version-less dispatch. A *clean* version-less
      # run matches neither this nor the success condition and stays silent, so
      # the release channel doesn't fill up with untagged builds.
      - name: Notify build failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Build failed*\n*Ref:* `${{ github.ref_name }}`\n*Repo:* `${{ github.repository }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

