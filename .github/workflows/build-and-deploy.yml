name: Build and Deploy Electron App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.18). Blank = git tag or short SHA.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version passed by the calling workflow.'
        required: false
        type: string

permissions:
  contents: write
  actions: read
  # Azure OIDC (federated) login for Trusted Signing on the Windows build.
  id-token: write

env:
  GCP_BUCKET: gs://smartloop-gcp-us-east-releases
  APP_NAME: smartloop-studio

jobs:
  notify-start:
    runs-on: ubuntu-latest
    outputs:
      framework_version: ${{ steps.fw.outputs.version }}
      build_version: ${{ steps.bv.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get framework version
        id: fw
        run: |
          VERSION=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" electron/slp-setup.js)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get build version
        id: bv
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Notify build started
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Build started*\n*Ref:* `${{ github.ref_name }}`\n*Repo:* `${{ github.repository }}`\n*Framework:* `${{ steps.fw.outputs.version }}`\n*Triggered by:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

  build-macos:
    needs: [notify-start]
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Import Apple Code Signing Certificates
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

      - name: Build for macOS
        run: make build-electron-mac
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 1

  build-linux:
    needs: [notify-start]
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build for Linux
        run: make build-electron-linux
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 1

  build-windows:
    needs: [notify-start]
    name: Build for Windows
    runs-on: windows-latest
    # Scopes the Azure OIDC token to a stable subject
    # (repo:smartloop-ai/smartloop-studio:environment:release) so a single
    # Trusted Signing federated credential covers both tag-push and manual
    # dispatch runs — same pattern as smartloop-ai/smartloop's build.yml.
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Authenticode-sign the app and installer with the same Azure Trusted
      # Signing account/profile that signs slp.exe in smartloop-ai/smartloop.
      # Auth is OIDC (federated) via the job's `id-token: write` — no secrets.
      # scripts/win-sign.js (electron-builder sign hook) does the signing.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The sign hook shells out to Invoke-TrustedSigning via powershell.exe,
      # so install the module for Windows PowerShell (CurrentUser scope).
      - name: Install TrustedSigning PowerShell module
        shell: powershell
        run: |
          try { Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction Stop } catch {}
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser

      - name: Build for Windows
        run: npm run electron-build-win
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}

      - name: Verify signature
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No setup exe found in dist/' }
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "$($setup.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "$($setup.Name) signature is $($sig.Status), expected Valid"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          retention-days: 1

  upload-to-gcp:
    name: Upload to GCP Bucket
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    outputs:
      download_urls: ${{ steps.urls.outputs.download_urls }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create version directory structure
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/$VERSION/macos
          mkdir -p release/$VERSION/linux
          mkdir -p release/$VERSION/windows

          if [ -d "artifacts/macos" ]; then
            mv artifacts/macos/* release/$VERSION/macos/ 2>/dev/null || true
          fi

          if [ -d "artifacts/linux" ]; then
            mv artifacts/linux/* release/$VERSION/linux/ 2>/dev/null || true
          fi

          if [ -d "artifacts/windows" ]; then
            mv artifacts/windows/* release/$VERSION/windows/ 2>/dev/null || true
          fi

          # Create latest symlinks
          mkdir -p release/latest
          cp -r release/$VERSION/* release/latest/

      - name: Upload to GCP Bucket
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Upload versioned files
          gsutil -m cp -r release/$VERSION/* ${{ env.GCP_BUCKET }}/$VERSION/
          
          # Upload latest files
          gsutil -m cp -r release/latest/* ${{ env.GCP_BUCKET }}/latest/
          
          # Make files publicly readable (optional)
          # gsutil -m acl ch -r -u AllUsers:R ${{ env.GCP_BUCKET }}/$VERSION/
          # gsutil -m acl ch -r -u AllUsers:R ${{ env.GCP_BUCKET }}/latest/

      - name: Collect public download URLs
        id: urls
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://dl.smartloop.ai"
          URLS=""
          if [ -d "release/$VERSION/macos" ]; then
            URLS="*MacOS:*\n"
            for f in release/$VERSION/macos/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/macos/${fname}|${fname}>\n"
            done
          fi
          if [ -d "release/$VERSION/linux" ]; then
            URLS="${URLS}*Linux:*\n"
            for f in release/$VERSION/linux/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/linux/${fname}|${fname}>\n"
            done
          fi
          if [ -d "release/$VERSION/windows" ]; then
            URLS="${URLS}*Windows:*\n"
            for f in release/$VERSION/windows/*; do
              fname=$(basename "$f")
              URLS="${URLS} • <${BASE_URL}/${VERSION}/windows/${fname}|${fname}>\n"
            done
          fi
          # Write as single line with literal \n so it's safe inside JSON strings
          echo "download_urls=${URLS}" >> $GITHUB_OUTPUT

      - name: Create version manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > manifest.json << EOF
          {
            "version": "$VERSION",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "files": {
              "macos": [
                $(cd release/$VERSION/macos 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ],
              "linux": [
                $(cd release/$VERSION/linux 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ],
              "windows": [
                $(cd release/$VERSION/windows 2>/dev/null && ls -1 | sed 's/^/"/' | sed 's/$/"/' | paste -sd ',' - || echo '""')
              ]
            }
          }
          EOF

      - name: Upload manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gsutil cp manifest.json ${{ env.GCP_BUCKET }}/$VERSION/manifest.json
          gsutil cp manifest.json ${{ env.GCP_BUCKET }}/latest/manifest.json

      - name: Generate download URLs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Download URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**macOS:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gsutil ls ${{ env.GCP_BUCKET }}/$VERSION/macos/ || echo "No macOS builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Linux:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gsutil ls ${{ env.GCP_BUCKET }}/$VERSION/linux/ || echo "No Linux builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Windows:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          gsutil ls ${{ env.GCP_BUCKET }}/$VERSION/windows/ || echo "No Windows builds" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Print GitHub artifact download URLs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
              per_page: 100
            });
            core.info(`GitHub Actions run: ${runUrl}`);
            if (!data.artifacts || data.artifacts.length === 0) {
              core.info("No artifacts found for this run.");
              await core.summary
                .addHeading("GitHub Artifact Downloads", 2)
                .addRaw(`Run: ${runUrl}\n\nNo artifacts found for this run.\n`)
                .write();
              return;
            }
            const links = data.artifacts.map((artifact) =>
              `- ${artifact.name}: https://github.com/${owner}/${repo}/actions/runs/${run_id}/artifacts/${artifact.id}`
            );
            core.info("GitHub artifact download URLs:");
            for (const link of links) {
              core.info(link);
            }
            await core.summary
              .addHeading("GitHub Artifact Downloads", 2)
              .addRaw(`Run: ${runUrl}\n\n`)
              .addRaw(links.join("\n") + "\n")
              .write();

  notify-result:
    if: always()
    needs: [notify-start, upload-to-gcp]
    runs-on: ubuntu-latest
    steps:
      - name: Notify build success
        if: needs.upload-to-gcp.result == 'success'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Build succeeded*\n*Build:* `${{ needs.notify-start.outputs.build_version }}`\n*Release:* `${{ needs.upload-to-gcp.outputs.version }}`\n*Framework:* `${{ needs.notify-start.outputs.framework_version }}`\n\n*Downloads:*\n${{ needs.upload-to-gcp.outputs.download_urls }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

      - name: Notify build failure
        if: needs.upload-to-gcp.result != 'success'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Build failed*\n*Ref:* `${{ github.ref_name }}`\n*Repo:* `${{ github.repository }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

