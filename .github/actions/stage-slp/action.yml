name: Stage SLP framework
description: >
  Download the SLP framework for the current runner OS and stage it at build/slp/
  so electron-builder can bundle it into the app (electron-builder.yml
  extraResources). Mirrors the runtime download in electron/slp-setup.js, but at
  build time. The version is read from electron/slp-setup.js.

runs:
  using: composite
  steps:
    - name: Download and stage SLP framework
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" electron/slp-setup.js)
        if [ -z "$VERSION" ]; then echo "::error::Could not read SLP VERSION from electron/slp-setup.js"; exit 1; fi

        # Map the runner OS to the framework artifact (mirrors detectPlatform()
        # in electron/slp-setup.js). Windows ships a .zip + slp.exe; the rest a
        # .tar.gz + slp.
        case "${RUNNER_OS:-}" in
          macOS)   PLAT=darwin  ARCH=arm64 EXT=tar.gz BIN=slp ;;
          Linux)   PLAT=linux   ARCH=amd64 EXT=tar.gz BIN=slp ;;
          Windows) PLAT=windows ARCH=amd64 EXT=zip    BIN=slp.exe ;;
          *) echo "::error::Unsupported RUNNER_OS='${RUNNER_OS:-}'"; exit 1 ;;
        esac
        URL="https://dl.smartloop.ai/slp/${VERSION}/${PLAT}-${ARCH}-slp.${EXT}"
        echo "Staging SLP ${VERSION} (${PLAT}-${ARCH}) from ${URL}"

        rm -rf build/slp && mkdir -p build/slp
        arc="$(mktemp -d)/slp.${EXT}"
        curl -fSL --retry 3 --retry-delay 5 -o "$arc" "$URL"

        # Extract to a temp dir first. The archive wraps the framework in a
        # top-level slp/ directory, so moving its CONTENTS into build/slp avoids
        # the slp binary colliding with the slp/ wrapper. Handle both wrapped and
        # flat archives. bsdtar (macOS/Windows runners' `tar`) reads zip too.
        tmp="$(mktemp -d)"
        if [ "$EXT" = "zip" ]; then tar -xf "$arc" -C "$tmp"; else tar -xzf "$arc" -C "$tmp"; fi
        rm -f "$arc"
        src="$tmp"
        if [ -d "$tmp/slp" ] && [ -e "$tmp/slp/$BIN" ]; then src="$tmp/slp"; fi
        shopt -s dotglob
        mv "$src"/* build/slp/
        shopt -u dotglob
        rm -rf "$tmp"

        [ "$BIN" = "slp" ] && chmod +x "build/slp/$BIN" || true
        if [ ! -e "build/slp/$BIN" ]; then echo "::error::SLP binary missing at build/slp/$BIN after staging"; exit 1; fi
        echo "Staged $(du -sh build/slp | cut -f1) into build/slp"
