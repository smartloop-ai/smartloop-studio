appId: ai.smartloop.studio
productName: Smartloop Studio
copyright: Copyright © 2026 Smartloop Inc.
buildVersion: 1.0.1
directories:
  output: dist
  buildResources: build
asar: true
extraResources:
  # Bundle data assets (e.g. the blank-project template) but NOT the SLP
  # framework — that is downloaded at runtime by slp-setup.js.
  - from: electron/data/
    to: data/
    filter:
      - "**/*"
      - "!slp/**"
protocols:
  name: smartloop
  schemes:
    - smartloop
files:
  - dist-web/**/*
  - electron/**/*
  - public/**/*
  - package.json
  - "!**/*.map"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!.env.local"
mac:
  category: public.app-category.productivity
  icon: icon.icns
  artifactName: studio-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: public/img/logo.png
  artifactName: studio-Setup-${version}.${ext}
  # Authenticode signing via Azure Trusted Signing — the same account/profile
  # that signs slp.exe in smartloop-ai/smartloop. The hook no-ops when the
  # AZURE_TS_* env vars are absent, so local builds stay unsigned but succeed.
  signtoolOptions:
    sign: ./scripts/win-sign.js
  target:
    - nsis
linux:
  icon: public/img/logo.png
  category: Development
  executableName: smartloop-studio
  artifactName: studio-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  # customInstall downloads/installs the SLP framework during setup (see
  # build/install-slp.ps1) so first launch skips the in-app download.
  # customUnInstall removes ~/.smartloop and the Electron user-data folder on
  # real uninstalls (kept during --updated upgrades).
  include: build/installer.nsh
  # Dark-theme branded left banner for the assisted installer/uninstaller
  # welcome and finish pages (164x314 BMP, Smartloop dark theme).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # One-click installers only (ours is assisted) — data removal is handled by
  # customUnInstall in build/installer.nsh instead.
  deleteAppDataOnUninstall: false
