appId: ai.smartloop.studio
productName: Smartloop Studio
copyright: Copyright © 2026 Smartloop Inc.
# buildVersion unset: electron-builder falls back to package.json's version.
directories:
  output: dist
  buildResources: build
asar: true
extraResources:
  # Bundle data assets (e.g. the blank-project template) but NOT the SLP
  # framework — that is downloaded at runtime by slp-setup.js.
  - from: electron/data/
    to: data/
    filter:
      - "**/*"
      - "!slp/**"
protocols:
  name: smartloop
  schemes:
    - smartloop
# electron-updater feed configuration. This exists for two reasons — NOT to
# publish from CI (CI copies artifacts to the CDN via gsutil itself):
#   1. Build-time: electron-builder only writes the latest*.yml update-metadata
#      files that scripts/build-release-json.py parses (sha512/size) when a
#      publish provider is set. `generic` forces that generation, and its upload
#      path is a no-op, so nothing is ever pushed to a provider.
#   2. Runtime placeholder: the url below is baked into app-update.yml, but the
#      app does NOT update from it directly. It reads the live `feed_url` from
#      the SLP /v1/releases/latest response and calls autoUpdater.setFeedURL()
#      (release-checker.js, stage 2). The API serves latest-mac.yml / latest.yml
#      on the fly from Mongo with absolute dl.smartloop.ai artifact URLs.
publish:
  provider: generic
  url: https://api.smartloop.ai/v1/releases/feed/stable
files:
  - dist-web/**/*
  - electron/**/*
  - public/**/*
  - package.json
  - "!**/*.map"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!.env.local"
mac:
  category: public.app-category.productivity
  icon: icon.icns
  artifactName: studio-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # macOS bundles TWO extra resources. NOTE: a platform-level extraResources
  # REPLACES the top-level one (electron-builder does not merge them), so the
  # data/ entry from the top level must be repeated here or it is dropped.
  #   1. data/ — the same bundled assets as every platform (blank-project
  #      template), minus the SLP framework.
  #   2. slp/ — the SLP framework (arm64 binary + Python runtime) shipped INSIDE
  #      the app for BOTH the direct-download (dmg) and MAS builds; the size is
  #      acceptable and it removes the first-launch download. CI stages it at
  #      build/slp/ before packaging; it lands at Contents/Resources/slp, which
  #      electron/build-mode.js resolves via process.resourcesPath and copies
  #      into the install dir on first run. The `mas` block below inherits this.
  # Windows/Linux are unaffected (top-level extraResources; runtime download).
  extraResources:
    - from: electron/data/
      to: data/
      filter:
        - "**/*"
        - "!slp/**"
    - from: build/slp/
      to: slp/
      filter:
        - "**/*"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
# Mac App Store build. NOT part of mac.target above, so normal `--mac` builds
# stay Developer ID (dmg/zip). Build the store .pkg explicitly with:
#   MAS_BUILD=1 electron-builder --mac mas
# Inherits everything from `mac` (including the bundled SLP extraResources) and
# only overrides signing: sandbox entitlements + provisioning profile, no
# hardened runtime, no notarization (the store notarizes on ingestion).
mas:
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
win:
  icon: public/img/logo.png
  artifactName: studio-Setup-${version}.${ext}
  # Authenticode signing via Azure Trusted Signing — the same account/profile
  # that signs slp.exe in smartloop-ai/smartloop. The hook only signs in CI
  # (CI/GITHUB_ACTIONS env) with AZURE_TS_* set, so local builds always stay
  # unsigned but succeed.
  signtoolOptions:
    sign: ./scripts/win-sign.js
  target:
    - nsis
linux:
  icon: public/img/logo.png
  category: Development
  executableName: smartloop-studio
  artifactName: studio-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  # customInstall downloads/installs the SLP framework during setup (see
  # build/install-slp.ps1) so first launch skips the in-app download.
  # customUnInstall removes ~/.smartloop and the Electron user-data folder on
  # real uninstalls (kept during --updated upgrades).
  include: build/installer.nsh
  # Dark-theme branded left banner for the assisted installer/uninstaller
  # welcome and finish pages (164x314 BMP, Smartloop dark theme).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  # Assisted installer: interactive users get the welcome/dir-picker/finish
  # wizard. Microsoft Store (cert 10.2.9.2) runs the same installer with /S,
  # which NSIS honors as a silent no-UI install — installer.nsh has a
  # ${Silent} branch so the SLP download works under /S. One build, both modes.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Data removal is handled by customUnInstall in build/installer.nsh instead.
  deleteAppDataOnUninstall: false
