appId: ai.smartloop.studio
productName: Smartloop Studio
copyright: Copyright © 2026 Smartloop Inc.
# buildVersion unset: electron-builder falls back to package.json's version.
directories:
  output: dist
  buildResources: build
asar: true
extraResources:
  # Data assets (e.g. the blank-project template) bundled on every platform,
  # minus any slp/ subdir. Each platform block (mac/win/linux) adds the bundled
  # SLP framework (slp/) via the &res_slp anchor.
  - &res_data
    from: electron/data/
    to: data/
    filter:
      - "**/*"
      - "!slp/**"
protocols:
  name: smartloop
  schemes:
    - smartloop
# electron-updater feed configuration. This exists for two reasons — NOT to
# publish from CI (CI copies artifacts to the CDN via gsutil itself):
#   1. Build-time: electron-builder only writes the latest*.yml update-metadata
#      files that scripts/build-release-json.py parses (sha512/size) when a
#      publish provider is set. `generic` forces that generation, and its upload
#      path is a no-op, so nothing is ever pushed to a provider.
#   2. Runtime placeholder: the url below is baked into app-update.yml, but the
#      app does NOT update from it directly. It reads the live `feed_url` from
#      the SLP /v1/releases/latest response and calls autoUpdater.setFeedURL()
#      (release-checker.js, stage 2). The API serves latest-mac.yml / latest.yml
#      on the fly from Mongo with absolute dl.smartloop.ai artifact URLs.
publish:
  provider: generic
  url: https://api.smartloop.ai/v1/releases/feed/stable
files:
  - dist-web/**/*
  - electron/**/*
  - public/**/*
  - package.json
  - "!**/*.map"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
  - "!.env.local"
mac:
  category: public.app-category.productivity
  icon: icon.icns
  artifactName: studio-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Bundle SLP inside the app on macOS (dmg + mas). A platform-level
  # extraResources REPLACES the top-level one, so the data entry is repeated via
  # the &res_data anchor. mas inherits this block.
  extraResources:
    - *res_data
    - &res_slp
      from: build/slp/
      to: slp/
      filter:
        - "**/*"
    # The bootstrap model, shipped so a first launch downloads nothing. Seeded
    # into the workspace by seedBundledModel() in main.js — SLP resolves weights
    # under <workspace>/models/, which only exists at runtime.
    - &res_models
      from: build/models/
      to: models/
      filter:
        - "**/*"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
# Mac App Store build. NOT part of mac.target above, so normal `--mac` builds
# stay Developer ID (dmg/zip). Build the store .pkg explicitly with:
#   MAS_BUILD=1 electron-builder --mac mas
# Inherits everything from `mac` (including the bundled SLP extraResources) and
# only overrides signing: sandbox entitlements + provisioning profile, no
# hardened runtime, no notarization (the store notarizes on ingestion).
mas:
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
# Mac App Store DEVELOPMENT build — a locally-LAUNCHABLE sandboxed .app for
# testing the App Sandbox without going through TestFlight. Build with:
#   MAS_BUILD=1 electron-builder --mac mas-dev   (npm run electron-pack-mas-dev)
# Output: dist/mas-dev-arm64/Smartloop Studio.app — double-click to run it under
# the REAL sandbox (process.mas === true), so it reproduces spawn EPERM /
# mimetypes / sem_open exactly like the store build, but unlike the distribution
# .pkg it launches locally. Requirements (one-time, from the Apple Developer
# portal): an "Apple Development" signing cert in the keychain, this Mac's device
# registered, and a "Mac App Development" provisioning profile for
# ai.smartloop.studio (with the device) saved to build/mas-dev.provisionprofile.
# Inherits the sandbox entitlements from `mas`.
masDev:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/mas-dev.provisionprofile
win:
  icon: public/img/logo.png
  artifactName: studio-Setup-${version}.${ext}
  # Bundle SLP inside the app on Windows too — it runs in place from
  # resources\slp, so the installer downloads nothing (see build/installer.nsh).
  # Repeat the data entry since a platform-level extraResources replaces the
  # top-level one.
  extraResources:
    - *res_data
    - *res_slp
    - *res_models
  # Authenticode signing via Azure Trusted Signing — the same account/profile
  # that signs slp.exe in smartloop-ai/smartloop. The hook only signs in CI
  # (CI/GITHUB_ACTIONS env) with AZURE_TS_* set, so local builds always stay
  # unsigned but succeed.
  signtoolOptions:
    sign: ./scripts/win-sign.js
  target:
    - nsis
linux:
  icon: public/img/logo.png
  category: Development
  executableName: smartloop-studio
  artifactName: studio-${version}-${arch}.${ext}
  # Bundle SLP on Linux too — the Linux framework was slimmed (~0.96 GB, CUDA
  # removed), so it's now comparable to mac/Windows and viable to ship in the
  # AppImage/deb. Repeat the data entry since platform extraResources replaces
  # the top-level one.
  extraResources:
    - *res_data
    - *res_slp
    - *res_models
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
nsis:
  # customInstall is empty: the SLP framework ships in resources\slp and runs in
  # place, so setup has nothing extra to install. customUnInstall removes
  # ~/.smartloop (SLP's home) and the Electron user-data folder on real
  # uninstalls (kept during --updated upgrades).
  include: build/installer.nsh
  # Dark-theme branded left banner for the assisted installer/uninstaller
  # welcome and finish pages (164x314 BMP, Smartloop dark theme).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  # Assisted installer: interactive users get the welcome/dir-picker/finish
  # wizard. Microsoft Store (cert 10.2.9.2) runs the same installer with /S,
  # which NSIS honors as a silent no-UI install. Nothing in customInstall needs
  # a UI, so the same build serves both modes.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Data removal is handled by customUnInstall in build/installer.nsh instead.
  deleteAppDataOnUninstall: false
